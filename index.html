<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }
    img {
        width: 101vw;
        height: 101vh;
        object-fit: cover;
        position: fixed;
        top: -0.5vh;
        left: -0.5vw;
        transition: opacity 0.3s ease;
    }
</style>
</head>
<body>
    <img id="bg-image" src="" alt="background">

    <script>

            // List of image URLs (1 to 50)

                "https://raw.githubusercontent.com/Shanu9534/Theme/main/8.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/9.jpg",

                "https://raw.githubusercontent.com/Shanu9534/Theme/main/11.jpg",

                "https://raw.githubusercontent.com/Shanu9534/Theme/main/15.jpg",

                "https://raw.githubusercontent.com/Shanu9534/Theme/main/17.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/18.jpg",

                "https://raw.githubusercontent.com/Shanu9534/Theme/main/22.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/23.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/24.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/25.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/26.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/27.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/28.jpg",

                "https://raw.githubusercontent.com/Shanu9534/Theme/main/47.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/48.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/49.jpg",
                "https://raw.githubusercontent.com/Shanu9534/Theme/main/50.jpg"
            ];

            function pickRandomImage() {
                const randomIndex = Math.floor(Math.random() * images.length);
                return images[randomIndex];
            }

            const imgElement = document.getElementById('bg-image');

            function applyImage() {
                const saved = localStorage.getItem('bgImageUrl');
                const lastChange = parseInt(localStorage.getItem('bgImageTime') || '0', 10);
                const now = Date.now();

                // 24 ghante nahi hue to wahi image rakho
                if (saved && (now - lastChange) < CHANGE_INTERVAL) {
                    imgElement.src = saved;
                } else {
                    const newImage = pickRandomImage();
                    imgElement.src = newImage;
                    localStorage.setItem('bgImageUrl', newImage);
                    localStorage.setItem('bgImageTime', now.toString());
                }
            }

            applyImage();

            function scheduleNextChange() {
                const lastChange = parseInt(localStorage.getItem('bgImageTime') || '0', 10);
                const now = Date.now();
                let delay = CHANGE_INTERVAL - ((now - lastChange) % CHANGE_INTERVAL);
                if (delay <= 0 || delay > CHANGE_INTERVAL) delay = CHANGE_INTERVAL;

                setTimeout(function() {
                    const newImage = pickRandomImage();
                    imgElement.style.opacity = '0';
                    setTimeout(function() {
                        imgElement.src = newImage;
                        imgElement.style.opacity = '1';
                        localStorage.setItem('bgImageUrl', newImage);
                        localStorage.setItem('bgImageTime', Date.now().toString());
                        scheduleNextChange();
                    }, 300);
                }, delay);
            }

            scheduleNextChange();
        })();
    </script>
</body>
</html>
